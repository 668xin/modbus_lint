name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash

      - name: Add moon to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Type check
        run: moon check

      - name: Run tests
        run: moon test

      - name: Build CLI
        run: moon build cmd/main
